name: Build Heaven & Hell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract uploaded project archive
        run: |
          mkdir -p project
          unzip -q heaven-hell-fabric-v0.3.0-dev.zip -d project
      - name: Patch Minecraft 1.21.11 API compatibility and existing updates
        run: python .github/scripts/patch_minecraft_1_21_11.py project/heaven-hell-fabric
      - name: Patch Angel regeneration and race projectile abilities
        run: python .github/scripts/patch_requested_abilities.py project/heaven-hell-fabric
      - name: Add Awakening energy, activation, lifecycle and multiplayer foundation
        run: python .github/scripts/patch_awakening_foundation.py project/heaven-hell-fabric
      - name: Fix Minecraft 1.21.11 Awakening particle option
        run: python .github/scripts/fix_awakening_particle.py project/heaven-hell-fabric
      - name: Apply PvP progression, empowered abilities, physical wings and Awakening HUD
        run: python .github/scripts/patch_awakening_rework.py project/heaven-hell-fabric
      - name: Fix Awakening progress to count pre-mitigation damage
        run: python .github/scripts/patch_awakening_raw_damage.py project/heaven-hell-fabric
      - name: Set corrective Awakening release version
        run: python .github/scripts/patch_awakening_version.py project/heaven-hell-fabric
      - name: Apply top-rank Ascension unlock, quest and chat notifications
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/scripts/patch_ascension_unlock.py.gz.b64'); pathlib.Path('.github/scripts/patch_ascension_unlock.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python .github/scripts/patch_ascension_unlock.py project/heaven-hell-fabric
          python -c "from pathlib import Path; p=Path('project/heaven-hell-fabric/src/main/java/com/kuku/heavenhell/gameplay/AwakeningService.java'); s=p.read_text(); old='data.awakeningEnergy -= HeavenHell.CONFIG.awakeningRequiredEnergy;'; assert old in s; p.write_text(s.replace(old, old+'\\n        data.awakeningReadyNotified = false;', 1))"
      - name: Apply homing Apocalypse meteors and terrain-safe Super Nova
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/scripts/patch_homing_meteors_and_supernova.py.gz.b64'); pathlib.Path('.github/scripts/patch_homing_meteors_and_supernova.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python .github/scripts/patch_homing_meteors_and_supernova.py project/heaven-hell-fabric
      - name: Apply Protection IV ability damage balance
        run: python .github/scripts/patch_ability_damage_balance.py project/heaven-hell-fabric
      - name: Apply Age of Ascension mastery and relic foundation
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/scripts/patch_age_of_ascension.py.gz.b64'); pathlib.Path('.github/scripts/patch_age_of_ascension.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python .github/scripts/patch_age_of_ascension.py project/heaven-hell-fabric
      - name: Fix Age of Ascension relic tooltip API
        run: python .github/scripts/patch_age_of_ascension_api_fix.py project/heaven-hell-fabric
      - name: Apply Age of Evolution
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/templates/EvolutionService.java.gz.b64'); pathlib.Path('project/heaven-hell-fabric/src/main/java/com/kuku/heavenhell/gameplay/EvolutionService.java').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/templates/EvolutionSigilItem.java.gz.b64'); pathlib.Path('project/heaven-hell-fabric/src/main/java/com/kuku/heavenhell/items/EvolutionSigilItem.java').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/scripts/patch_evolution.py.gz.b64'); pathlib.Path('.github/scripts/patch_evolution.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          python .github/scripts/patch_evolution.py project/heaven-hell-fabric
      - name: Create patched source archive
        run: |
          cd project
          zip -qr ../heaven-hell-fabric-v0.9.0-dev-evolution-src.zip heaven-hell-fabric
      - name: Build mod
        working-directory: project/heaven-hell-fabric
        run: gradle --no-daemon clean build
      - name: Upload mod and patched source
        uses: actions/upload-artifact@v4
        with:
          name: heaven-hell-fabric-v0.9.0-dev-evolution
          path: |
            project/heaven-hell-fabric/build/libs/*.jar
            heaven-hell-fabric-v0.9.0-dev-evolution-src.zip
          if-no-files-found: error
