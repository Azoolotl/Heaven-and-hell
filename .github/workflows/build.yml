name: Build Heaven & Hell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract uploaded project archive
        run: |
          mkdir -p project
          unzip -q heaven-hell-fabric-v0.3.0-dev.zip -d project
      - name: Build mod
        working-directory: project/heaven-hell-fabric
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: heaven-hell-fabric-0.3.0-dev
          path: project/heaven-hell-fabric/build/libs/*.jar
          if-no-files-found: error
